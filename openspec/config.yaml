project: termux-dotfiles
stack: bash/zsh/tmux/neovim
context: >
  Portable AI Developer Workstation for mobile-first development on Termux/Android.
  Modular architecture with isolated subsystems (shell, tmux, nvim, AI workflows).
  ~98% Bash scripts with gum-powered tmux popup orchestration.
  MIT License. Versioned releases from main (stable branch).
  Distribution via cURL installer (primary), Termux packaging (v1.1), Homebrew (v1.2).
  Repair/recovery mechanism via scripts/repair.sh.
  Conventional commits required. Changes flow: dev -> main -> tag -> release.

strict_tdd: true
testing:
  runner: bats
  test_command: bats --recursive tests/
  layers:
    unit: true
    integration: false
    e2e: true
  coverage: false
  quality_tools:
    linter: shellcheck
    type_checker: false
    formatter: false

phases:
  proposal: { min_context: 2, review_required: true }
  spec: { review_required: true }
  design: { review_required: true }
  tasks: { review_required: true }
  apply: { auto_test: true }
  verify: { require_tests: true }
  archive: { confirm: true }
