name: Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build .deb
        run: |
          # Copy debbuild staging tree
          cp -r debbuild /tmp/debbuild
          # Substitute __VERSION__ in control
          sed -i "s/__VERSION__/${{ steps.version.outputs.VERSION }}/g" \
            /tmp/debbuild/DEBIAN/control
          # Build .deb from the debbuild directory
          dpkg-deb --build /tmp/debbuild
          # Rename with version info
          mv /tmp/debbuild.deb \
            /tmp/termux-dotfiles_${{ steps.version.outputs.VERSION }}_all.deb

      - name: Extract release notes
        id: notes
        run: |
          # Strip patch version to match CHANGELOG header format (v1.1.0 -> v1.1)
          MAJOR_MINOR=$(echo "${{ steps.version.outputs.VERSION }}" | cut -d. -f1,2)
          TAG="v${MAJOR_MINOR}"
          SECTION=$(sed -n "/^## \[${TAG}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.notes.outputs.NOTES }}" \
            /tmp/termux-dotfiles_${{ steps.version.outputs.VERSION }}_all.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}