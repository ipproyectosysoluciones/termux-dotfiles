name: ShellCheck

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # Lint all shell scripts (errors only — pre-existing warnings tracked separately)
          find . -type f \( -name "*.sh" -o -name "*.bash" \) -not -path "./.git/*" -exec shellcheck -S error {} +
