name: ShellCheck

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # Lint all shell scripts
          find . -type f \( -name "*.sh" -o -name "*.bash" \) -not -path "./.git/*" -exec shellcheck {} +
