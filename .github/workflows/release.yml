name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="# Release ${TAG} \n\n See CHANGELOG.md for detailed changes."
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
