name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="# Release ${TAG}\n\nSee CHANGELOG.md for detailed changes."
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
