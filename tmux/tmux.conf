# =========================================
# PREFIX
# =========================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# =========================================
# GENERAL
# =========================================

set-option -g update-environment "SSH_AUTH_SOCK SSH_AGENT_PID"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# =========================================
# PERFORMANCE
# =========================================

set -sg escape-time 0
set -g focus-events off
set -g display-panes-time 800
set -g repeat-time 300
set -g set-clipboard on


# =========================================
# TERMUX / COLORS
# =========================================

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

# =========================================
# BETTER SCROLLING
# =========================================

setw -g mode-keys vi

# =========================================
# SPLITS
# =========================================

unbind '"'
unbind %

bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# =========================================
# PANE NAVIGATION
# =========================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# =========================================
# PANE NAVIGATION WITHOUT PREFIX
# =========================================

bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-h select-pane -L
bind-key -n M-l select-pane -R

# =========================================
# WINDOW NAVIGATION
# =========================================

bind n next-window
bind p previous-window

# Android-friendly
bind-key -n M-1 previous-window
bind-key -n M-2 next-window

bind-key -n M-c new-window
bind-key -n M-x kill-window

# =========================================
# RESIZE PANES
# =========================================

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =========================================
# WINDOWS
# =========================================

bind c new-window -c "#{pane_current_path}"

# =========================================
# RELOAD CONFIG
# =========================================

bind r source-file ~/.tmux.conf \; display "tmux reloaded"

# =========================================
# COPY MODE
# =========================================

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# =========================================
# STATUS BAR
# =========================================

set -g status-position bottom
set -g status-justify left

set -g status-style "bg=black,fg=white"

set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[fg=green,bold]#S #[fg=cyan]#I:#W"

set -g status-right "#[fg=yellow]#{pane_current_command} #[fg=cyan]%H:%M #[fg=green]%d-%m-%Y"

# =========================================
# ACTIVITY
# =========================================

setw -g monitor-activity on
set -g visual-activity off

# =========================================
# ANDROID FRIENDLY
# =========================================

set -g detach-on-destroy off
set -g aggressive-resize off

# =========================================
# STARTUP MESSAGE OFF
# =========================================

set -g display-time 1000

# =========================================
# EASY SESSION SWITCH
# =========================================

bind s choose-session

# =========================================
# TPM
# =========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run '~/.tmux/plugins/tpm/tpm'

# =========================================
# keybinding tmux
# =========================================

bind-key A display-popup -w 70% -h 70% -E "~/dotfiles/scripts/ai/menu.sh"

