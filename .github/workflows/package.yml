name: Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build .deb
        run: |
          # Copy debbuild staging tree
          cp -r debbuild /tmp/debbuild
          # Substitute __VERSION__ in control
          sed -i "s/__VERSION__/${{ steps.version.outputs.VERSION }}/g" \
            /tmp/debbuild/DEBIAN/control
          # Build .deb from the debbuild directory
          # dpkg-deb --build creates /tmp/debbuild.deb
          dpkg-deb --build /tmp/debbuild
          # Rename with version info
          mv /tmp/debbuild.deb \
            /tmp/termux-dotfiles_${{ steps.version.outputs.VERSION }}_all.deb

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/termux-dotfiles_${{ steps.version.outputs.VERSION }}_all.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}